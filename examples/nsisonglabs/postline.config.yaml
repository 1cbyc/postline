# Nsisong Labs (nsisonglabs.com), the software studio behind postline.
# Light theme in the studio's blue, LinkedIn page plus a Bluesky account.
brand:
  name: Nsisong Labs
  url: nsisonglabs.com
  logo: assets/logo.svg
  font:
    family: "{font.family}"
    url: https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=block
  colors:
    background: "{color.surface.page}"
    panel: "{color.surface.panel}"
    border: "{color.surface.line}"
    text: "{color.text.primary}"
    muted: "{color.text.muted}"
    accent: "{color.text.accent}"
    ok: ["#cfe9da", "#1d5c3a"]
    warn: ["#f6e2b3", "#6b4a00"]
    bad: ["#f4cfc8", "#8a2a1b"]

# Bring your own design system: tokens, a stylesheet and custom layouts.
design:
  tokens: design/tokens.json
  stylesheet: design/brand.css
  templates: design/templates     # quote.html -> layout: quote

# Full-quality copies of every card, kept on this computer.
library:
  dir: ~/Pictures/postline/nsisong-labs
  scale: 3

timezone: Africa/Lagos

schedule:
  weekStartsOn: mon
  days: [mon, wed, fri]
  times: ["09:00"]

card:
  size: square
  format: png
  scale: 2

channels:
  linkedin:
    type: linkedin
    organization: "REPLACE_WITH_PAGE_ID"   # linkedin.com/company/<id>/admin
  bluesky:
    type: bluesky
  archive:
    type: files
    dir: archive

rules:
  maxHashtags: 2
  allowEmoji: false
  allowedLinkDomains: [nsisonglabs.com, nsisong.com]
  hookMaxChars: 120
  requireImage: true
  topicCooldownDays: 14
  bannedPhrases: ["game-changer", "revolutionize", "in today's fast-paced world"]
